schema_version: 1
name: sf-enterprise-patterns
display_name: Salesforce Enterprise Patterns
summary: Implement and enforce the Aleysian house Salesforce architecture on a project
  codebase - service layer shared by trigger, UI, and API entry points, a lean owned
  UnitOfWork for all DML, selector classes with USER_MODE for all SOQL, DTO returns
  from AuraEnabled controllers, and imperative Apex from LWC - with a tested PMD 7
  ruleset, an ESLint rule, and an arch_check orchestrator that adds warn/block policy,
  legacy-path downgrades, and suppression-reason governance.
status: active
tier: situational
version: 1.0.0
owner: Aleysian
category: delivery-lifecycle
runtimes:
- generic-agent-skills
- chatgpt
- codex
- claude-ai
- cowork
triggers:
- 'Implement and enforce the Aleysian house Salesforce architecture: service layer,
  unit of work, selector classes, DTO returns from AuraEnabled controllers, imperative
  Apex from LWC. Trigger when writing or reviewing Apex classes, triggers, or LWC
  JavaScript; when scaffolding a new Salesforce feature; on "new apex class", "add
  a trigger", "LWC component", "service layer", "unit of work", "selector", "DTO",
  "arch check", "architecture violation", "run the architecture checks", "set up
  pre-commit checks", or bringing legacy Apex toward the house pattern. Also covers
  the Trigger Actions Framework as the handler-layer variant. Do NOT trigger for
  delivery-standards install/audit (sf-delivery-standards), deploys and promotion
  (sf-deploy-engine), or non-Salesforce code.'
exclusions: []
inputs:
- name: task_context
  required: true
  description: The Salesforce code to write or review, or the repo to wire the checks
    into.
outputs:
- name: conforming_code_and_check_results
  format: code-and-terminal-output
  audience: internal
  durable: true
  hub_target: null
connectors:
  required: []
  optional: []
depends_on: []
calls: []
knowledge_hub:
  requirement: not-applicable
  reads: []
  writes: []
evidence:
  required: false
  control: null
quality:
  required: false
  control: null
canon_exempt: engineering-doc
waivers:
- 'Enforcement-stack reference an agent must hold in full: rule IDs, exit codes, suppression
  contract, and engine semantics, punctuation included.'
