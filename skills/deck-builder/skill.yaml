schema_version: 1
name: deck-builder
display_name: Deck Builder
summary: Stage-gated production of a proposal/sales deck from a brief to a finished
  deck, with a one-message gate up front and an accumulating polish-review loop at
  the end.
status: active
tier: core
version: 1.0.0
owner: Aleysian
category: pursuit-intelligence
runtimes:
- generic-agent-skills
- chatgpt
- codex
- claude-ai
- cowork
triggers:
- Stage-gated production of a proposal/sales deck from a brief to a finished deck,
  with a one-message gate up front and an accumulating polish-review loop at the end.
  Use when building a multi-slide proposal, pitch, or client deck and you want discipline
  (lock the argument before designing) plus a self-improving final QA pass. Defers
  all brand, color, and visual decisions to brand-renderer and the final
  copy pass to prose-pass.
exclusions: []
inputs:
- name: task_context
  required: true
  description: The request and available source context for this workflow.
outputs:
- name: markdown_run_record
  format: markdown
  audience: internal-or-client-as-requested
  durable: true
  hub_target: deliverables.register
connectors:
  required: []
  optional:
  - google-drive
depends_on:
- knowledge-hub
calls:
- evidence-core
- quality-gate
knowledge_hub:
  requirement: optional
  reads:
  - client.front_door
  - client.profile
  writes: []
evidence:
  required: true
  control: evidence-core
quality:
  required: true
  control: quality-gate
