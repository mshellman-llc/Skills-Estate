schema_version: 1
name: compare-scope-options
display_name: Scope Reference
summary: Build a static, print-ready, profile-branded scope reference from current quotes or dated
  exports.
status: active
tier: situational
version: 1.1.0
owner: Skills Estate
category: solutioning-scope
runtimes:
- generic-agent-skills
- chatgpt
- codex
- claude-ai
- cowork
triggers:
- Build a static, print-ready, profile-branded scope reference from current quotes or dated
  exports. For several options, show option cards plus one complete side-by-side line-item
  matrix with hours and in, available, optional, or out states. For one quote, show
  one summary with every present item state. Validate every item, hour, state, and
  timeline-snapshot price 1:1 before rendering. Use for a scope reference, option
  summary, scope comparison, option matrix, what is included, what is in each tier,
  a flat client leave-behind, or a side-by-side comparison of Q-numbers. This page
  shows the full matrix at once. Never use it for a clickable or interactive proposal,
  a version switcher, or a page where the prospect switches between versions one at
  a time; use build-interactive-proposal. Not a DDOC decision deck or SOW contract.
exclusions: []
inputs:
- name: task_context
  required: true
  description: The request and available source context for this workflow.
outputs:
- name: scope_reference
  format: html
  audience: internal-or-client-as-requested
  durable: true
  hub_target: deliverables.register
- name: reconciliation_receipt
  format: json
  durable: true
connectors:
  required: []
  optional:
  - google-drive
depends_on:
- knowledge-hub
calls:
- evidence-core
- review-deliverable
knowledge_hub:
  requirement: required
  reads:
  - opportunity.front_door
  - opportunity.solution_scope
  - evidence.claims
  writes:
  - opportunity.solution_scope
  - deliverables.register
evidence:
  required: true
  control: evidence-core
quality:
  required: true
  control: review-deliverable
