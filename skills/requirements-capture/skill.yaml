schema_version: 1
name: requirements-capture
display_name: Requirements Capture
summary: Capture and structure business requirements in the Aleysian approved format.
status: active
tier: core
version: 1.1.0
owner: Aleysian
category: solutioning-scope
runtimes:
- generic-agent-skills
- chatgpt
- codex
- claude-ai
- cowork
triggers:
- Capture and structure business requirements in the Aleysian approved format. Use
  this skill whenever the user wants to define, write, organize, or refine business
  requirements, epics, capabilities, user stories, or acceptance criteria. Triggers
  on phrases like "capture requirements", "write user stories", "define epics", "requirements
  gathering", "business requirements document", "BRD", "acceptance criteria", "Gherkin",
  "requirements CSV", "Aleysian format", or any mention of structuring product/project
  requirements into epics, capabilities, and user stories. Also trigger when a user
  uploads a document (deck, PRD, brief, spec, meeting transcript) and wants requirements
  extracted from it. Even if the user just says "help me break this down into requirements"
  or "what are the epics here", use this skill. Also trigger when the source is a
  Salesforce SOW, where "analyze this SOW", "SOW to backlog", "Salesforce BA", "BA
  bot", or a Salesforce Statement of Work uploaded for requirements extraction all
  run this skill in BA mode. Always read the host spreadsheet skill before generating
  the workbook.
exclusions: []
inputs:
- name: task_context
  required: true
  description: The request and available source context for this workflow.
outputs:
- name: markdown_run_record
  format: markdown
  audience: internal-or-client-as-requested
  durable: true
  hub_target: deliverables.register
connectors:
  required: []
  optional:
  - google-drive
depends_on:
- knowledge-hub
calls:
- evidence-core
- quality-gate
knowledge_hub:
  requirement: required
  reads:
  - engagement.front_door
  - engagement.contract_commitments
  - engagement.requirements_design
  - evidence.claims
  writes:
  - engagement.requirements_design
  - engagement.control
  - deliverables.register
evidence:
  required: true
  control: evidence-core
quality:
  required: true
  control: quality-gate
