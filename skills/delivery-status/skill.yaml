schema_version: 1
name: delivery-status
display_name: Delivery Status
summary: 'Continuous delivery documentation for Aleysian engagements: the weekly or
  per-cadence client status report built from transcripts and the governance logs,
  stewardship of the RAID and decision logs with stable IDs, and scope-drift detection
  against the SOW scope baseline that raises change-order CANDIDATES with an evidence
  trail.'
status: active
tier: situational
version: 0.2.1
owner: Aleysian
category: delivery-lifecycle
runtimes:
- generic-agent-skills
- chatgpt
- codex
- claude-ai
- cowork
triggers:
- 'Continuous delivery documentation for Aleysian engagements: the weekly or per-cadence
  client status report built from transcripts and the governance logs, stewardship
  of the RAID and decision logs with stable IDs, and scope-drift detection against
  the SOW scope baseline that raises change-order CANDIDATES with an evidence trail.
  Use whenever someone asks for a weekly status, project status, client status report,
  delivery update, "what moved this week", to log a decision or risk from a meeting,
  to update the RAID log, or says "the client wants a status" or "did we agree to
  that in scope?". Trigger on status report, RAID log, decision log, scope drift,
  scope creep, change order candidate, burn report, or a meeting transcript paired
  with a delivery engagement. Do NOT use for authoring change orders or SOWs (sow-quality,
  sow), kickoff or charter (aleysian-delivery-kickoff), UAT tracking (aleysian-uat-validation),
  pricing (the Aleysian Pricing System), or sales pursuits (call-prep).'
exclusions: []
inputs:
- name: task_context
  required: true
  description: The request and available source context for this workflow.
outputs:
- name: markdown_run_record
  format: markdown
  audience: internal-or-client-as-requested
  durable: true
  hub_target: deliverables.register
connectors:
  required: []
  optional:
  - google-drive
depends_on:
- knowledge-hub
calls:
- evidence-core
- quality-gate
knowledge_hub:
  requirement: required
  reads:
  - engagement.front_door
  - engagement.delivery_status
  - engagement.control
  writes:
  - engagement.delivery_status
  - engagement.control
evidence:
  required: true
  control: evidence-core
quality:
  required: true
  control: quality-gate
license: Proprietary to Aleysian LLC.
