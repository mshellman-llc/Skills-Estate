{
  "schema_version": 1,
  "name": "manage-color-system",
  "display_name": "Manage color system",
  "summary": "Assess, question, decide, propose and apply UI color systems in Material 3 role language. Audits token files (CSS or Design System tokens.json) and component CSS for contrast in WCAG and APCA, role coverage, palette drift, wrong ratio notes, off-system hex values and a stale compiled stylesheet; builds themed role tokens with standard and high-contrast levels from tonal palettes; reviews color changes before they ship. Use when colors, tokens, themes or a brand palette are created, changed or judged, or before publishing a page that sets its own colors. Not for a full WCAG audit of an interface (audit-accessibility), applying a confirmed brand to a deliverable (manage-brand-profile) or building a chart (build-editorial-chart).",
  "status": "draft",
  "version": "0.1.0",
  "owner": "Estate",
  "category": "evidence-quality",
  "tier": "situational",
