<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scope options</title>
<style>
*{box-sizing:border-box}body{margin:0;background:var(--brand-background);color:var(--brand-text);font:var(--fs-body)/1.55 var(--font-sans)}
header,main,footer{max-width:1120px;margin:auto;padding:24px}header{border-bottom:var(--brand-border-width) solid var(--brand-border)}
h1,h2,h3{font-family:var(--brand-font-headings);line-height:1.2}h1{font-size:clamp(28px,4vw,44px);margin:12px 0}h2{margin:0 0 16px}h3{margin:0 0 8px}
.logo{max-width:170px;max-height:56px;object-fit:contain}.muted,.source{color:var(--brand-muted)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}button{font:inherit;color:var(--brand-text);background:var(--brand-background);border:var(--brand-border-width) solid var(--brand-border);border-radius:var(--radius);padding:10px 16px;cursor:pointer}
button[aria-selected=true]{color:var(--brand-background);background:var(--brand-accent);border-color:var(--brand-accent)}
button:focus-visible,summary:focus-visible{outline:3px solid var(--brand-accent);outline-offset:3px}
.panel{background:var(--brand-surface);padding:24px;border-radius:var(--radius)}.metric{font-size:36px;font-weight:700;font-variant-numeric:tabular-nums;margin:8px 0}
section,details{margin:28px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.item{padding:18px;border:var(--brand-border-width) solid var(--brand-border);border-radius:var(--radius)}.item.out{border-style:dashed;background:var(--brand-surface)}
.pill{font-weight:600;color:var(--brand-accent)}p{margin:8px 0}li{margin:6px 0}.source{font-size:14px;overflow-wrap:anywhere}
summary{font-weight:700;cursor:pointer;padding:10px 0}.disclosure{padding:12px 0}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--brand-border);vertical-align:top;overflow-wrap:anywhere}
footer{border-top:1px solid var(--brand-border)}[hidden]{display:none!important}
@media(max-width:700px){header,main,footer{padding:18px}.grid{grid-template-columns:1fr}.panel{padding:18px}.metric{font-size:30px}}
.rk-timeline{margin-top:16px}
__RK_CSS__
@page{size:Letter;margin:12mm}
@media print{
  .tabs,.item.out{display:none!important}
  header,main,footer{padding:0;max-width:none}
  header{padding-bottom:12px}footer{padding-top:10px;margin-top:16px}
  body{font-size:11pt}h1{font-size:26pt}h2{font-size:16pt;margin-bottom:10px}h3{font-size:12pt}
  section,details{margin:14px 0}p{margin:6px 0}li{margin:4px 0}
  summary{padding:0;break-after:avoid}.disclosure{padding:4px 0}
  details .disclosure{display:block!important}details{break-inside:auto}
  .panel{padding:14px;print-color-adjust:exact}.metric{font-size:28pt}
  #version-panel{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:18px}
  #version-name{grid-column:1;grid-row:1}
  #tagline{grid-column:1;grid-row:2}
  #metric{grid-column:2;grid-row:1 / 3;text-align:right;margin:0}
  #metric-label{grid-column:2;grid-row:3;text-align:right}
  #duration{grid-column:1;grid-row:3}
  #version-source{grid-column:1 / -1;grid-row:4}
  #scope{grid-template-columns:repeat(auto-fit,minmax(50mm,1fr))}
  .item{padding:12px;break-inside:avoid}.source{font-size:9pt}
  h2,h3{break-after:avoid}tr{break-inside:avoid}th,td{padding:6px}
  .next-steps,#phase-zero,#staffing{break-inside:avoid}
}
</style></head><body>
<header><img class="logo" src="__LOGO__" alt="Selected brand logo"><p id="identity" class="muted"></p><h1 id="title"></h1><p id="prepared"></p><p id="validity"></p><p id="mode-note"></p></header>
<main>
<div class="tabs" role="tablist" aria-label="Scope version" id="tabs"></div>
<section class="panel" role="tabpanel" id="version-panel" tabindex="0"><h2 id="version-name"></h2><p id="tagline"></p><p class="metric" id="metric"></p><p id="metric-label"></p><p id="duration"></p><p id="version-source" class="source"></p></section>
<section><h2>Scope by version</h2><div id="scope" class="grid"></div></section>
<section id="staffing"><h2>Team and timeline</h2><div class="grid"><div><h3>Team</h3><ul id="team"></ul></div><div><h3>Timeline</h3><ul id="timeline"></ul></div></div><div class="rk rk-embed rk-timeline" id="timeline-chart" hidden></div></section>
<section id="architecture-section" hidden><h2>Systems and interfaces</h2><p id="architecture"></p></section>
<section id="decision-section" hidden><h2>Open decisions</h2><ul id="decisions"></ul></section>
<section id="phase-zero" hidden><h2 id="phase-name"></h2><p id="phase-description"></p><ul id="phase-outputs"></ul></section>
<details id="assumptions"><summary>Assumptions</summary><div class="disclosure"><ul id="assumption-list"></ul></div></details>
<details id="boundaries"><summary>Excluded work</summary><div class="disclosure"><ul id="boundary-list"></ul></div></details>
<details id="sources"><summary>Sources for scope and figures</summary><div class="disclosure"><p id="counting"></p><ul id="source-list"></ul><table><thead><tr><th>Displayed figure</th><th>Source field</th></tr></thead><tbody id="audit"></tbody></table></div></details>
<section class="next-steps"><h2>Next steps</h2><ol id="next-steps"></ol></section>
</main><footer id="confidentiality"></footer>
<script type="application/json" id="proposal-data">__PROPOSAL_DATA__</script>
<script>__RK_JS__</script>
<script>
'use strict';
const data=JSON.parse(document.getElementById('proposal-data').textContent);
const byId=id=>document.getElementById(id);
const put=(id,text)=>{byId(id).textContent=text;};
const item=(tag,text,cls)=>{const node=document.createElement(tag);node.textContent=text;if(cls)node.className=cls;return node;};
const list=(id,values)=>byId(id).replaceChildren(...values.map(v=>item('li',v)));
const priced=data.meta.mode==='proposal';
const sourceLabel=id=>{const s=data.sources.find(s=>s.id===id);return s.title+' · '+s.reference+' · '+s.revision;};
put('identity',data.meta.client);put('title',data.meta.opportunity);
document.title=data.meta.client+' · '+data.meta.opportunity;
put('prepared',data.meta.prepared_by+' · '+data.meta.date);
put('validity',data.meta.validity);put('confidentiality',data.meta.confidentiality);
put('mode-note',priced?'Proposal: select a quoted scope version.':'Scope options for review. Price, staffing and duration need confirmation.');
byId('staffing').hidden=!priced;
if(!priced){byId('phase-zero').hidden=false;put('phase-name',data.phase_zero.name);put('phase-description',data.phase_zero.description);list('phase-outputs',data.phase_zero.outputs);put('counting',data.counting_method);}
if(data.architecture){byId('architecture-section').hidden=false;put('architecture',data.architecture);}
if(data.decisions?.length){byId('decision-section').hidden=false;list('decisions',data.decisions.map(d=>d.question+' Owner: '+d.owner+'. Source: '+sourceLabel(d.source)));}
list('source-list',data.sources.map(s=>s.title+' · '+s.reference+' · '+s.revision));
list('next-steps',data.next_steps);
const buttons=data.versions.map((v,index)=>{
  const button=item('button',v.name);button.id='tab-'+v.key;button.dataset.key=v.key;button.setAttribute('role','tab');button.setAttribute('aria-controls','version-panel');
  button.addEventListener('click',()=>select(index));
  button.addEventListener('keydown',event=>{
    let target=index;
    if(event.key==='ArrowRight')target=(index+1)%buttons.length;
    else if(event.key==='ArrowLeft')target=(index+buttons.length-1)%buttons.length;
    else if(event.key==='Home')target=0;else if(event.key==='End')target=buttons.length-1;else return;
    event.preventDefault();select(target);buttons[target].focus();
  });return button;
});
byId('tabs').replaceChildren(...buttons);
function select(index){
  const v=data.versions[index];
  buttons.forEach((button,i)=>{button.setAttribute('aria-selected',String(i===index));button.tabIndex=i===index?0:-1;});
  byId('version-panel').setAttribute('aria-labelledby','tab-'+v.key);
  byId('version-panel').dataset.version=v.key;
  put('version-name',v.name);put('tagline',v.tagline);
  const amount=priced?new Intl.NumberFormat('en-US',{style:'currency',currency:data.meta.currency,minimumFractionDigits:2,maximumFractionDigits:20}).format(v.total):String(v.metric);
  put('metric',amount);put('metric-label',priced?'Quoted total':v.metric_label);
  put('duration',priced?String(v.duration_weeks)+' weeks':'');byId('duration').hidden=!priced;
  put('version-source','Source: '+sourceLabel(v.source));
  byId('scope').replaceChildren(...data._scope_items.map(scope=>{
    const included=v._included_ids.includes(scope.id);
    const card=document.createElement('article');card.className='item'+(included?'':' out');card.dataset.scopeId=scope.id;
    card.append(item('p',included?'In this version':'Not in this version','pill'),item('p',scope.section,'muted'),item('h3',scope.name),item('p',scope.description));
    if(!included)card.append(item('p','To add this work: '+v.not_included.find(b=>b.item===scope.name).route));
    card.append(item('p','Source: '+sourceLabel(scope.source),'source'));return card;
  }));
  if(priced){list('team',v.team.map(t=>t.role+' · '+t.allocation));list('timeline',v.timeline.map(t=>t.phase+' · weeks '+t.weeks));drawTimeline(v);}
  list('assumption-list',v.assumptions);list('boundary-list',v.not_included.length?v.not_included.map(b=>b.item+' · '+b.route):['No additional exclusions are recorded for this version.']);
  const rows=priced?[[amount,data.meta.quote_number+' · versions['+v.key+'].total'],[String(v.duration_weeks)+' weeks',data.meta.quote_number+' · versions['+v.key+'].duration_weeks'],...v.team.map((t,i)=>[t.role+': '+t.allocation,data.meta.quote_number+' · versions['+v.key+'].team['+i+']']),...v.timeline.map((t,i)=>[t.phase+': '+t.weeks,data.meta.quote_number+' · versions['+v.key+'].timeline['+i+']'])]:[[String(v.metric)+' '+v.metric_label,'Distinct included scope IDs: '+v._included_ids.join(', ')],['Price, team and duration absent','No confirmed quote']];
  byId('audit').replaceChildren(...rows.map(row=>{const tr=document.createElement('tr');tr.append(...row.map(cell=>item('td',cell)));return tr;}));
}
// Quoted phases on a relative week axis. Week numbers come from the quote's weeks field; the
// placeholder dates only position bars. A phase whose weeks are not "N" or "N-M" keeps the list alone.
function drawTimeline(v){
  const chart=byId('timeline-chart'),DAY=86400000,base=Date.UTC(2001,0,1);
  const iso=t=>new Date(t).toISOString().slice(0,10);
  const spans=v.timeline.map(t=>{const m=String(t.weeks).trim().match(/^(\d+)(?:\s*[-\u2013]\s*(\d+))?$/);return m&&[Number(m[1]),Number(m[2]||m[1])];});
  if(!window.RoadmapKit||spans.some(s=>!s||s[0]<1||s[1]<s[0])){chart.hidden=true;return;}
  const last=Math.max(...spans.map(s=>s[1]));
  const plan={kit:1,id:'proposal-'+v.key,persist:false,meta:{title:v.name+' timeline'},
    legend:{items:v.timeline.map((t,i)=>({key:'p'+i,label:t.phase,c:i%6+1}))},
    blocks:[{type:'timeline',relative:'week',labelHeader:'Phase',start:iso(base),end:iso(base+(last*7-1)*DAY),unitWidth:last>12?48:68,
      rows:v.timeline.map((t,i)=>({id:'p'+i,label:t.phase,group:'p'+i,start:iso(base+(spans[i][0]-1)*7*DAY),end:iso(base+(spans[i][1]*7-1)*DAY)}))}]};
  chart.hidden=false;
  RoadmapKit.mount(plan,chart,{embed:true,live:false,parts:['blocks']});
  byId('timeline').closest('div').hidden=true;
}
select(0);
let disclosureState;
window.addEventListener('beforeprint',()=>{disclosureState=[...document.querySelectorAll('details')].map(d=>d.open);document.querySelectorAll('details').forEach(d=>d.open=true);});
window.addEventListener('afterprint',()=>{document.querySelectorAll('details').forEach((d,i)=>d.open=disclosureState?.[i]??false);});
</script></body></html>
