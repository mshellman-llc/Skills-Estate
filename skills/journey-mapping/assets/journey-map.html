<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Journey map</title>
<!--
  Journey map starter. Edit the MAP object below; the board, curve, blueprint
  rows and friction cards render from it. Colors are the estate neutral
  profile. Replace the :root values with a confirmed project profile when one
  applies, and keep the role names.
-->
<style>
:root{
  --bg:#FFFFFF;--text:#1A1A1A;--muted:#5F6368;--border:#D9DCE1;--surface:#F5F6F7;--accent:#2F5D8A;
  --band:var(--text);--band-text:var(--bg);--pain:var(--surface);--opp:var(--surface);--bp:var(--surface);
  --radius:4px;--font:system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 var(--font)}
.wrap{max-width:1200px;margin:0 auto;padding:0 16px}
header{padding:40px 0 24px;border-bottom:1px solid var(--border)}
.eyebrow{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
h1{margin:8px 0;font-size:32px;line-height:1.2}
.lead{max-width:70ch;color:var(--muted);margin:0}
section{padding:32px 0}
.legend{display:flex;flex-wrap:wrap;gap:16px;margin-bottom:16px;font-size:14px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.sw{width:14px;height:14px;border:1px solid var(--border);border-radius:var(--radius)}
.board{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius)}
.grid{display:grid;gap:1px;background:var(--border)}
.grid>div{background:var(--bg)}
.lab{position:sticky;left:0;z-index:2;background:var(--surface)!important;padding:12px;font-size:12px;font-weight:700;
  text-transform:uppercase;letter-spacing:.06em;color:var(--muted);display:flex;align-items:center}
.ph{background:var(--band)!important;color:var(--band-text);padding:12px}
.ph b{display:block;font-size:12px;opacity:.75}
.cell{padding:12px;font-size:14px;color:var(--muted)}
.think{font-style:italic}
.hypothesis{border-bottom:1px dashed var(--muted)}
.basis-tag{display:block;font-size:11px;font-style:normal;font-weight:600}
.pain{background:var(--pain)!important}
.opp{background:var(--opp)!important;color:var(--accent)}
.bp{background:var(--bp)!important}
.vis{background:var(--band)!important;color:var(--band-text);padding:6px 12px;font-size:12px;font-weight:700;
  text-transform:uppercase;letter-spacing:.06em}
.vis span{position:sticky;left:12px}
.emotion svg{display:block;width:100%;height:132px}
.curve{fill:none;stroke:var(--accent);stroke-width:2.5}
.curve.hyp{stroke-dasharray:6 5}
.dot{fill:var(--accent)}
.gl{stroke:var(--border)}
.note{font-size:14px;color:var(--muted);margin-top:12px;max-width:90ch}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media(max-width:820px){.cards{grid-template-columns:1fr}h1{font-size:26px}}
.card{border:1px solid var(--border);border-radius:var(--radius);padding:16px}
.card .tag{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--accent)}
.card h3{margin:6px 0;font-size:18px}
.card p{margin:0;font-size:14px;color:var(--muted)}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="eyebrow" id="eyebrow"></div>
  <h1 id="title"></h1>
  <p class="lead" id="lead"></p>
</div></header>

<section><div class="wrap">
  <div class="legend" id="legend"></div>
  <div class="board"><div class="grid" id="grid"></div></div>
  <p class="note" id="basis"></p>
</div></section>

<section><div class="wrap">
  <h2>Friction to address</h2>
  <div class="cards" id="cards"></div>
</div></section>

<script>
// Example content is illustrative. Replace every value with sourced or labeled material.
const MAP = {
  eyebrow: "Illustrative journey map",
  title: "The support agent's journey",
  lead: "One escalated case, from arrival to a confirmed fix. Where the agent's path dips.",
  emotionBasis: "hypothesis",          // "evidence" or "hypothesis"
  basisNote: "Synthetic example for adapting the template. No participant research or system inspection supports these sample values. Replace them with your evidence and labeled hypotheses before sharing a map.",
  phases: ["Case arrives", "Read the history", "Diagnose", "Hand off", "Confirm the fix"],
  emotion: [3, 2, 3, 1, 4],            // 1 to 5, one per phase
  rows: [
    {label: "Step and touchpoint", cells: ["Case lands · queue", "Prior tickets · CRM", "Logs · admin console", "Escalation · chat", "Customer reply · email"]},
    {label: "Goal", cells: ["Know if it is mine", "See what was tried", "Find the cause", "Get engineering in", "Close it for good"]},
    {label: "Thoughts", basis: "hypothesis", style: "think", cells: ["Is this urgent?", "What did they already try?", "Is it config or a bug?", "Will they pick it up today?", "Did it actually work?"]},
    {label: "Pain points", basis: "hypothesis", style: "pain", cells: ["Priority not set", "History split across tools", "No log access", "Handoff restarts the story", "No confirmation step"]},
    {label: "Opportunities", style: "opp", cells: ["Set priority at intake", "One case timeline", "Read-only log view", "Carry context into the handoff", "Prompt for confirmation"]}
  ],
  blueprint: [
    {label: "Front-stage", cells: ["Queue view", null, null, "Escalation form", "Reply template"]},
    {label: "Back-stage", cells: ["Routing rule", null, "Manual log pull", null, "Status never updated"]},
    {label: "Supporting", cells: ["CRM", "CRM, old ticket tool", "Logging service", "Engineering tracker", "CRM"]}
  ],
  friction: [
    {phase: "02", title: "History is split across two tools", body: "The agent rebuilds the case from the CRM and the old ticket tool before diagnosing."},
    {phase: "04", title: "The handoff restarts the story", body: "The escalation form carries no case history, so engineering asks the same questions again."},
    {phase: "05", title: "Nothing confirms the fix", body: "The status is never updated after the customer replies, so reopen rates cannot be measured."}
  ]
};

const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
// Fail visibly instead of changing, truncating or inventing supplied values.
function validateMap(map) {
  const fail = message => { throw new Error(message); };
  if (!Array.isArray(map.phases) || !map.phases.length || map.phases.some(p => typeof p !== "string" || !p.trim())) fail("Provide at least one named phase.");
  const n = map.phases.length;
  if (!["evidence", "hypothesis", "not captured"].includes(map.emotionBasis)) fail("State the emotional curve's evidence basis.");
  if (map.emotion == null) {
    if (map.emotionBasis !== "not captured") fail("Missing emotion values must be marked not captured.");
  } else if (map.emotionBasis === "not captured") fail("Use null for an uncaptured emotional curve.");
  else if (!Array.isArray(map.emotion) || map.emotion.length !== n || map.emotion.some(v => !Number.isFinite(v) || v < 1 || v > 5)) fail("Emotion needs one number from 1 to 5 per phase; values have not been changed.");
  if (map.emotionLabels !== undefined) {
    if (!Array.isArray(map.emotionLabels) || map.emotionLabels.length !== n) fail("Feelings need exactly one description or null per phase.");
    for (const item of map.emotionLabels) {
      if (item === null) continue;
      if (!item || typeof item !== "object" || Array.isArray(item) || typeof item.text !== "string" || !item.text.trim() || !["observed", "reported", "hypothesis"].includes(item.basis) || typeof item.source !== "string" || !item.source.trim()) fail("Each feeling needs text, an evidence basis and a source or hypothesis reason.");
    }
  }
  if (typeof map.basisNote !== "string" || !map.basisNote.trim()) fail("Provide the evidence-basis note.");
  for (const [key, labels] of [["rows", ["Step and touchpoint", "Goal", "Thoughts", "Pain points", "Opportunities"]], ["blueprint", ["Front-stage", "Back-stage", "Supporting"]]]) {
    const rows = map[key];
    if (!Array.isArray(rows) || rows.length !== labels.length || rows.some((row, i) => !row || row.label !== labels[i])) fail(`Provide the ${key} rows in the documented order.`);
    for (const row of rows) {
      if (!Array.isArray(row.cells) || row.cells.length !== n || row.cells.some(v => v !== null && typeof v !== "string")) fail(`${row.label} needs exactly one text or null cell per phase.`);
      if (["Thoughts", "Pain points"].includes(row.label) && !["observed", "reported", "hypothesis", "not captured"].includes(row.basis)) fail(`${row.label} needs its own evidence basis.`);
    }
  }
  if (!Array.isArray(map.friction) || map.friction.some(f => !f || !/^\d+$/.test(f.phase) || Number(f.phase) < 1 || Number(f.phase) > n || typeof f.title !== "string" || typeof f.body !== "string")) fail("Each friction card needs a valid phase, title and explanation.");
}
try {
validateMap(MAP);
const n = MAP.phases.length;
document.getElementById("eyebrow").textContent = MAP.eyebrow;
document.getElementById("title").textContent = MAP.title;
document.getElementById("lead").textContent = MAP.lead;
document.getElementById("basis").textContent = MAP.basisNote;

const legend = document.getElementById("legend");
[["Phase", "var(--band)"], ["Pain point", "var(--pain)"], ["Opportunity", "var(--opp)"]].forEach(([t, c]) => {
  const s = el("span"); const w = el("i", "sw"); w.style.background = c; s.append(w, t); legend.append(s);
});
legend.append(el("span", null, MAP.emotion == null ? "Emotion scores: not captured" : MAP.emotionBasis === "hypothesis" ? "Emotional curve, low to high (hypothesis, dashed)" : "Emotional curve, low to high"));

const grid = document.getElementById("grid");
grid.style.gridTemplateColumns = `190px repeat(${n}, minmax(150px, 1fr))`;
grid.style.minWidth = `${190 + n * 150}px`;
const labelCell = t => el("div", "lab", t);

grid.append(labelCell("Phase"));
MAP.phases.forEach((p, i) => { const c = el("div", "ph"); c.append(el("b", null, String(i + 1).padStart(2, "0")), p); grid.append(c); });

grid.append(labelCell("Emotion scores"));
const em = el("div", "emotion"); em.style.gridColumn = `2 / span ${n}`;
if (MAP.emotion == null) { em.textContent = "Not captured"; grid.append(em); } else {
const W = n * 100, H = 132, pad = 16, y = v => H - pad - (v - 1) / 4 * (H - 2 * pad);
const pts = MAP.emotion.map((v, i) => [i * 100 + 50, y(v)]);
let svg = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Emotional curve${MAP.emotionBasis === "hypothesis" ? ", hypothesis" : ""}">`;
[1, 3, 5].forEach(v => svg += `<line class="gl" x1="0" x2="${W}" y1="${y(v)}" y2="${y(v)}"/>`);
svg += `<polyline class="curve${MAP.emotionBasis === "hypothesis" ? " hyp" : ""}" vector-effect="non-scaling-stroke" points="${pts.map(p => p.join(",")).join(" ")}"/>`;
pts.forEach(([cx, cy]) => svg += `<circle class="dot" cx="${cx}" cy="${cy}" r="4"/>`);
em.innerHTML = svg + "</svg>"; grid.append(em);
}

const addRow = (r, extra) => {
  grid.append(labelCell(r.label));
  r.cells.forEach(t => {
    const cell = el("div", `cell ${extra || r.style || ""}${r.basis === "hypothesis" && t !== null && t.trim() ? " hypothesis" : ""}`, t === null ? "Not captured" : t);
    if (r.basis) cell.append(el("span", "basis-tag", t === null ? "not captured" : r.basis));
    grid.append(cell);
  });
};
if (MAP.emotionLabels !== undefined) {
  grid.append(labelCell("Feelings"));
  MAP.emotionLabels.forEach(item => {
    const cell = el("div", `cell feeling${item && item.basis === "hypothesis" ? " hypothesis" : ""}`, item === null ? "Not captured" : item.text);
    if (item) cell.append(el("span", "basis-tag", `${item.basis} · ${item.source}`));
    grid.append(cell);
  });
}
const divider = label => { const band = el("div", "vis"); band.append(el("span", null, label)); band.style.gridColumn = "1 / -1"; grid.append(band); };
MAP.rows.forEach(r => addRow(r));
addRow(MAP.blueprint[0], "bp");
divider("Line of visibility");
addRow(MAP.blueprint[1], "bp");
divider("Line of internal interaction");
addRow(MAP.blueprint[2], "bp");

const cards = document.getElementById("cards");
MAP.friction.forEach(f => { const c = el("div", "card"); c.append(el("div", "tag", `Phase ${f.phase}`), el("h3", null, f.title), el("p", null, f.body)); cards.append(c); });
} catch (error) {
  document.getElementById("grid").replaceChildren();
  document.getElementById("cards").replaceChildren();
  const message = el("p", "note", `Map cannot be rendered: ${error.message}`);
  message.setAttribute("role", "alert");
  document.querySelector(".board").replaceChildren(message);
}
</script>
</body>
</html>
