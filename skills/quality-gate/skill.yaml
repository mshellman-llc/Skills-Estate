schema_version: 1
name: quality-gate
display_name: Quality Gate
summary: Run the required Estate release controls and refuse finalization without
  executable prose, brand, and evidence records.
status: active
tier: core
version: 1.2.0
owner: Estate
category: evidence-quality
runtimes:
- generic-agent-skills
- chatgpt
- codex
- claude-ai
- cowork
triggers:
- Use before finalizing any Estate Word document, PowerPoint deck, Excel workbook,
  PDF, HTML page, proposal, report, email, Slack message, or decision-bearing artifact.
  Require executable evidence from prose-pass and brand-renderer, not a claim that
  another skill was mentioned.
exclusions: []
inputs:
- name: task_context
  required: true
  description: The request and available source context for this workflow.
outputs:
- name: markdown_run_record
  format: markdown
  audience: internal-or-client-as-requested
  durable: true
  hub_target: null
connectors:
  required: []
  optional: []
depends_on: []
calls:
- prose-pass
- sow-quality
knowledge_hub:
  requirement: not-applicable
  reads: []
  writes: []
evidence:
  required: false
  control: null
quality:
  required: false
  control: null
