<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Journey map</title>
<!--
  Journey map starter. Edit the MAP object below; the board, curve, blueprint
  rows and friction cards render from it. Colors are the estate neutral
  profile. Replace the :root values with a confirmed project profile when one
  applies, and keep the role names.
-->
<style>
:root{
  --bg:#FFFFFF;--text:#11141A;--muted:#535559;--border:#E2E2E3;--surface:#F5F5F5;--accent:#37437D;
  --band:var(--text);--band-text:var(--bg);--pain:var(--surface);--opp:var(--bg);--bp:var(--bg);
  --radius:8px;--font:system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
  /* Opportunity board (roadmap components): the same profile roles under their estate names. */
  --brand-background:var(--bg);--brand-text:var(--text);--brand-muted:var(--muted);--brand-border:var(--border);
  --brand-surface:var(--surface);--brand-accent:var(--accent);--brand-border-width:1px;--font-sans:var(--font);
  --brand-chart-1:#24265B;--brand-chart-2:#434D90;--brand-chart-3:#6577BD;--brand-chart-4:#8BA1DE;--brand-chart-5:#B5CAFA;--brand-chart-6:#535559;
  --brand-status-good:#18703F;--brand-status-warning:#96500A;--brand-status-critical:#C4302B;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 var(--font)}
.wrap{max-width:1200px;margin:0 auto;padding:0 16px}
header{padding:40px 0 24px;border-bottom:1px solid var(--border)}
.eyebrow{font-size:16px;font-weight:600;color:var(--muted)}
h1{margin:8px 0;font-size:32px;line-height:1.2}
.lead{max-width:70ch;color:var(--muted);margin:0}
section{padding:32px 0}
.legend{display:flex;flex-wrap:wrap;gap:16px;margin-bottom:16px;font-size:16px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.sw{width:14px;height:14px;border:1px solid var(--border);border-radius:4px}
.board{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius)}
.grid{display:grid;gap:1px;background:var(--border)}
.grid>div{background:var(--bg)}
.lab{position:sticky;left:0;z-index:2;background:var(--surface)!important;padding:12px;font-size:16px;font-weight:700;
  color:var(--muted);display:flex;align-items:center}
.ph{background:var(--band)!important;color:var(--band-text);padding:12px}
.ph b{display:block;font-size:16px;opacity:.75}
.cell{padding:12px;font-size:16px;color:var(--muted)}
.think{font-style:italic}
.ref{font-size:12px;font-weight:600;font-style:normal;color:var(--accent);text-decoration:none;margin-left:3px;vertical-align:super;line-height:0}
.ref:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.evidence{font-size:16px;color:var(--muted);margin:8px 0 0;padding-left:24px;max-width:90ch}
.evidence li{margin:2px 0}
.pain{background:var(--pain)!important}
.opp{background:var(--opp)!important;color:var(--accent)}
.bp{background:var(--bp)!important}
.vis{background:var(--band)!important;color:var(--band-text);padding:6px 12px;font-size:16px;font-weight:700}
.vis span{position:sticky;left:12px}
.emotion svg{display:block;width:100%;height:132px}
.curve{fill:none;stroke:var(--accent);stroke-width:2.5}
.curve.hyp{stroke-dasharray:6 5}
.dot{fill:var(--accent)}
.gl{stroke:var(--border)}
.note{font-size:16px;color:var(--muted);margin-top:12px;max-width:90ch}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media(max-width:820px){.cards{grid-template-columns:1fr}h1{font-size:26px}}
.card{border:1px solid var(--border);border-radius:var(--radius);padding:16px}
.card .tag{font-size:16px;font-weight:700;color:var(--accent)}
.card h3{margin:6px 0;font-size:18px}
.card p{margin:0;font-size:16px;color:var(--muted)}
#opps{--rk-min-text:16px}
.opp-list{margin:0;padding-left:24px;font-size:16px}
</style>
<style id="rk-css">/*__RK_CSS__*/</style>
</head>
<body>
<header><div class="wrap">
  <div class="eyebrow" id="eyebrow"></div>
  <h1 id="title"></h1>
  <p class="lead" id="lead"></p>
</div></header>

<main>
<section><div class="wrap">
  <div class="legend" id="legend"></div>
  <div class="board"><div class="grid" id="grid"></div></div>
  <p class="note" id="basis"></p>
  <ol class="evidence" id="evidence" aria-label="Evidence"></ol>
</div></section>

<section><div class="wrap">
  <h2>Friction to address</h2>
  <div class="cards" id="cards"></div>
</div></section>

<section id="opp-section" hidden><div class="wrap">
  <h2>Opportunity map</h2>
  <div class="rk rk-embed" id="opps"></div>
</div></section>
</main>

<script id="rk-js">/*__RK_JS__*/</script>

<script>
// Example content is illustrative. Replace every value with sourced or labeled material.
// emotionBasis is evidence or hypothesis. Emotion values use 1 to 5, one per phase.
const MAP = {
  "eyebrow": "Illustrative journey map",
  "title": "The support agent's journey",
  "lead": "One escalated case, from arrival to a confirmed fix. Where the agent's path dips.",
  "emotionBasis": "hypothesis",
  "basisNote": "Synthetic example for adapting the template. No participant research or system inspection supports these sample values. Replace them with your evidence, and list any hypotheses in the evidence list, before sharing a map.",
  "phases": [
    "Case arrives",
    "Read the history",
    "Diagnose",
    "Hand off",
    "Confirm the fix"
  ],
  "emotion": [
    3,
    2,
    3,
    1,
    4
  ],
  "rows": [
    {
      "label": "Step and touchpoint",
      "cells": [
        "Case lands · queue",
        "Prior tickets · CRM",
        "Logs · admin console",
        "Escalation · chat",
        "Customer reply · email"
      ]
    },
    {
      "label": "Goal",
      "cells": [
        "Know if it is mine",
        "See what was tried",
        "Find the cause",
        "Get engineering in",
        "Close it for good"
      ]
    },
    {
      "label": "Thoughts",
      "basis": "hypothesis",
      "style": "think",
      "cells": [
        "Is this urgent?",
        "What did they already try?",
        "Is it config or a bug?",
        "Will they pick it up today?",
        "Did it actually work?"
      ]
    },
    {
      "label": "Pain points",
      "basis": "hypothesis",
      "style": "pain",
      "cells": [
        "Priority not set",
        "History split across tools",
        "No log access",
        "Handoff restarts the story",
        "No confirmation step"
      ]
    },
    {
      "label": "Opportunities",
      "style": "opp",
      "cells": [
        "Set priority at intake",
        "One case timeline",
        "Read-only log view",
        "Carry context into the handoff",
        "Prompt for confirmation"
      ]
    }
  ],
  "blueprint": [
    {
      "label": "Front-stage",
      "cells": [
        "Queue view",
        null,
        null,
        "Escalation form",
        "Reply template"
      ]
    },
    {
      "label": "Back-stage",
      "cells": [
        "Routing rule",
        null,
        "Manual log pull",
        null,
        "Status never updated"
      ]
    },
    {
      "label": "Supporting",
      "cells": [
        "CRM",
        "CRM, old ticket tool",
        "Logging service",
        "Engineering tracker",
        "CRM"
      ]
    }
  ],
  "friction": [
    {
      "phase": "02",
      "title": "History is split across two tools",
      "body": "The agent rebuilds the case from the CRM and the old ticket tool before diagnosing."
    },
    {
      "phase": "04",
      "title": "The handoff restarts the story",
      "body": "The escalation form carries no case history, so engineering asks the same questions again."
    },
    {
      "phase": "05",
      "title": "Nothing confirms the fix",
      "body": "The status is never updated after the customer replies, so reopen rates cannot be measured."
    }
  ],
  "opportunityMap": [
    {
      "phase": "04",
      "kind": "quick win",
      "title": "Carry the case history into the escalation form",
      "intervention": "Prefill the form with the last three actions and the logs already checked.",
      "outcome": "Engineering starts without asking the agent to repeat the story",
      "measure": "Questions sent back per escalation",
      "dependsOn": "Form owner approves two new fields",
      "effort": "Low: form configuration",
      "owner": "TBD",
      "basis": "hypothesis",
      "source": "Synthetic example"
    },
    {
      "phase": "05",
      "kind": "quick win",
      "title": "Ask the customer to confirm the fix before closing",
      "intervention": "Send one confirmation request and close the case on a yes or after 7 days.",
      "outcome": "Fixed cases are recorded as fixed",
      "measure": "Reopen rate within 14 days of close",
      "dependsOn": "Status field update after the reply",
      "effort": "Low: workflow rule",
      "owner": "TBD",
      "basis": "hypothesis",
      "source": "Synthetic example"
    },
    {
      "phase": "02",
      "kind": "strategic bet",
      "title": "One case timeline across the CRM and the old ticket tool",
      "intervention": "Show prior tickets from both tools in the case view.",
      "outcome": "The agent reads one history before diagnosing",
      "measure": "Time from case open to first diagnostic action",
      "dependsOn": "Read access to the old ticket tool",
      "effort": "Medium: integration",
      "owner": "TBD",
      "basis": "hypothesis",
      "source": "Synthetic example"
    }
  ]
};

const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
const requiredCells = label => `${label} needs exactly one text or null cell per phase.`;
// Fail visibly instead of changing, truncating or inventing supplied values.
function validateMap(map) {
  const fail = message => { throw new Error(message); };
  if (!Array.isArray(map.phases) || !map.phases.length || map.phases.some(p => typeof p !== "string" || !p.trim())) fail("Provide at least one named phase.");
  const n = map.phases.length;
  if (typeof map.title !== "string" || !map.title.trim()) fail("Provide a map title.");
  if (map.visibilityUnknown !== undefined && (!Array.isArray(map.visibilityUnknown) || map.visibilityUnknown.length !== n || map.visibilityUnknown.some(v => v !== null && typeof v !== "string"))) fail(requiredCells("Unknown visibility"));
  if (!["evidence", "hypothesis", "not captured"].includes(map.emotionBasis)) fail("State the emotional curve's evidence basis.");
  if (map.emotion == null) {
    if (map.emotionBasis !== "not captured") fail("Missing emotion values must be marked not captured.");
  } else if (map.emotionBasis === "not captured") fail("Use null for an uncaptured emotional curve.");
  else if (!Array.isArray(map.emotion) || map.emotion.length !== n || map.emotion.some(v => !Number.isFinite(v) || v < 1 || v > 5)) fail("Emotion needs one number from 1 to 5 per phase; values have not been changed.");
  if (map.emotionLabels !== undefined) {
    if (!Array.isArray(map.emotionLabels) || map.emotionLabels.length !== n) fail("Feelings need exactly one description or null per phase.");
    for (const item of map.emotionLabels) {
      if (item === null) continue;
      if (!item || typeof item !== "object" || Array.isArray(item) || typeof item.text !== "string" || !item.text.trim() || !["observed", "reported", "hypothesis"].includes(item.basis) || typeof item.source !== "string" || !item.source.trim()) fail("Each feeling needs text, an evidence basis and a source or hypothesis reason.");
    }
  }
  if (typeof map.basisNote !== "string" || !map.basisNote.trim()) fail("Provide the evidence-basis note.");
  for (const [key, labels] of [["rows", ["Step and touchpoint", "Goal", "Thoughts", "Pain points", "Opportunities"]], ["blueprint", ["Front-stage", "Back-stage", "Supporting"]]]) {
    const rows = map[key];
    if (!Array.isArray(rows) || rows.length !== labels.length || rows.some((row, i) => !row || row.label !== labels[i])) fail(`Provide the ${key} rows in the documented order.`);
    for (const row of rows) {
      if (!Array.isArray(row.cells) || row.cells.length !== n || row.cells.some(v => v !== null && typeof v !== "string")) fail(requiredCells(row.label));
      if (["Thoughts", "Pain points"].includes(row.label) && !["observed", "reported", "hypothesis", "not captured"].includes(row.basis)) fail(`${row.label} needs its own evidence basis.`);
      if (row.basis !== undefined && !["observed", "reported", "hypothesis", "not captured"].includes(row.basis)) fail(`${row.label} has an invalid evidence basis.`);
      if (row.basis === "not captured" && row.cells.some(v => v !== null && v.trim())) fail(`${row.label} has text marked not captured; provide its evidence basis.`);
    }
  }
  if (!Array.isArray(map.friction) || map.friction.some(f => !f || !/^\d+$/.test(f.phase) || Number(f.phase) < 1 || Number(f.phase) > n || typeof f.title !== "string" || typeof f.body !== "string")) fail("Each friction card needs a valid phase, title and explanation.");
  if (map.opportunityMap !== undefined) {
    const text = v => typeof v === "string" && v.trim();
    if (!Array.isArray(map.opportunityMap) || map.opportunityMap.some(o => !o || !/^\d+$/.test(o.phase) || Number(o.phase) < 1 || Number(o.phase) > n || !OPP_KINDS[o.kind] || !text(o.title) || !text(o.outcome) || !text(o.measure) || !["observed", "reported", "hypothesis"].includes(o.basis) || !text(o.source))) fail("Each opportunity needs a valid phase, kind, title, expected outcome, measure, evidence basis and source.");
  }
}
const OPP_KINDS = {"quick win": "Quick wins", "strategic bet": "Strategic bets", "cross-team gap": "Cross-team gaps", "disconnect": "Front-to-back disconnects"};
try {
validateMap(MAP);
document.title = MAP.title;
const n = MAP.phases.length;
document.getElementById("eyebrow").textContent = MAP.eyebrow;
document.getElementById("title").textContent = MAP.title;
document.getElementById("lead").textContent = MAP.lead;
document.getElementById("basis").textContent = MAP.basisNote;

const legend = document.getElementById("legend");
[["Phase", "var(--band)"], ["Pain point", "var(--pain)"], ["Opportunity", "var(--accent)"]].forEach(([t, c]) => {
  const s = el("span"); const w = el("i", "sw"); w.style.background = c; s.append(w, t); legend.append(s);
});
const curveLegend = "Emotional curve, low to high";
legend.append(el("span", null, MAP.emotion == null ? "Emotion scores: not captured" : curveLegend + (MAP.emotionBasis === "hypothesis" ? " (hypothesis, dashed)" : "")));

const grid = document.getElementById("grid");
grid.style.gridTemplateColumns = `190px repeat(${n}, minmax(150px, 1fr))`;
grid.style.minWidth = `${190 + n * 150}px`;
const labelCell = t => el("div", "lab", t);

grid.append(labelCell("Phase"));
MAP.phases.forEach((p, i) => { const c = el("div", "ph"); c.append(el("b", null, String(i + 1).padStart(2, "0")), p); grid.append(c); });

grid.append(labelCell("Emotion scores"));
const em = el("div", "emotion"); em.style.gridColumn = `2 / span ${n}`;
if (MAP.emotion == null) { em.textContent = "Not captured"; grid.append(em); } else {
const W = n * 100, H = 132, pad = 16, y = v => H - pad - (v - 1) / 4 * (H - 2 * pad);
const pts = MAP.emotion.map((v, i) => [i * 100 + 50, y(v)]);
let svg = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Emotional curve${MAP.emotionBasis === "hypothesis" ? ", hypothesis" : ""}">`;
[1, 3, 5].forEach(v => svg += `<line class="gl" x1="0" x2="${W}" y1="${y(v)}" y2="${y(v)}"/>`);
svg += `<polyline class="curve${MAP.emotionBasis === "hypothesis" ? " hyp" : ""}" vector-effect="non-scaling-stroke" points="${pts.map(p => p.join(",")).join(" ")}"/>`;
pts.forEach(([cx, cy]) => svg += `<circle class="dot" cx="${cx}" cy="${cy}" r="4"/>`);
em.innerHTML = svg + "</svg>"; grid.append(em);
}

// Evidence shows as reference numbers that point to one list under the board, not as labels in every cell.
const evidence = document.getElementById("evidence");
const cap = t => t.charAt(0).toUpperCase() + t.slice(1);
const ref = text => {
  const k = evidence.children.length + 1;
  const li = el("li", null, text); li.id = `ev-${k}`; evidence.append(li);
  const a = el("a", "ref", String(k)); a.href = `#ev-${k}`; a.setAttribute("aria-label", `Evidence ${k}`);
  return a;
};
const addRow = (r, extra) => {
  const lab = labelCell(r.label);
  if (r.basis && r.basis !== "not captured" && r.cells.some(t => t !== null && t.trim())) lab.append(ref(`${r.label}: ${cap(r.basis)}${r.source ? ` · ${r.source}` : ""}`));
  grid.append(lab);
  r.cells.forEach(t => {
    grid.append(el("div", `cell ${extra || r.style || ""}`, t === null ? (r.label === "Opportunities" && r.basis !== "not captured" ? "None proposed" : "Not captured") : t));
  });
};
if (MAP.emotionLabels !== undefined) {
  grid.append(labelCell("Feelings"));
  MAP.emotionLabels.forEach((item, i) => {
    const cell = el("div", "cell feeling", item === null ? "Not captured" : item.text);
    if (item) cell.append(ref(`Feeling, phase ${String(i + 1).padStart(2, "0")}: ${cap(item.basis)} · ${item.source}`));
    grid.append(cell);
  });
}
const divider = label => { const band = el("div", "vis"); band.append(el("span", null, label)); band.style.gridColumn = "1 / -1"; grid.append(band); };
MAP.rows.forEach(r => addRow(r));
if (MAP.visibilityUnknown?.some(t => t !== null && t.trim())) addRow({label:"Visibility not captured", cells:MAP.visibilityUnknown});
addRow(MAP.blueprint[0], "bp");
divider("Line of visibility");
addRow(MAP.blueprint[1], "bp");
divider("Line of internal interaction");
addRow(MAP.blueprint[2], "bp");

const cards = document.getElementById("cards");
MAP.friction.forEach(f => { const c = el("div", "card"); c.append(el("div", "tag", `Phase ${f.phase}`), el("h3", null, f.title), el("p", null, f.body)); cards.append(c); });

// The opportunity map renders with the roadmap components when the build inlines them; otherwise as a list.
if (MAP.opportunityMap?.length) {
  document.getElementById("opp-section").hidden = false;
  const opps = document.getElementById("opps"), seen = {};
  const cite = o => { const t = `Opportunity: ${cap(o.basis)} · ${o.source}`; return seen[t] || (seen[t] = Number(ref(t).textContent)); };
  if (window.RoadmapKit) {
    const kinds = Object.keys(OPP_KINDS).filter(k => MAP.opportunityMap.some(o => o.kind === k));
    RoadmapKit.mount({kit: 1, id: "journey-opportunities", persist: false, meta: {title: "Opportunity map", citeHref: "#ev-"},
      blocks: [{type: "board", movable: false, columns: kinds.map(k => ({id: k, title: OPP_KINDS[k]})),
        cards: MAP.opportunityMap.map((o, i) => ({id: "o" + i, col: o.kind, kicker: `Phase ${o.phase}`, title: o.title, body: o.intervention, cite: [cite(o)],
          owner: o.owner === undefined ? false : o.owner,
          fields: [["Outcome", o.outcome], ["Measure", o.measure], ...(o.dependsOn ? [["Depends on", o.dependsOn]] : []), ...(o.effort ? [["Effort", o.effort]] : [])]}))}]},
      opps, {embed: true, live: false, parts: ["blocks"]});
  } else {
    const list = el("ol", "opp-list");
    MAP.opportunityMap.forEach(o => { const k = cite(o), li = el("li", null, `${OPP_KINDS[o.kind]}, phase ${o.phase}: ${o.title}. Outcome: ${o.outcome}. Measure: ${o.measure}.`); const a = el("a", "ref", String(k)); a.href = `#ev-${k}`; li.append(a); list.append(li); });
    opps.replaceChildren(list);
  }
}
} catch (error) {
  document.getElementById("grid").replaceChildren();
  document.getElementById("cards").replaceChildren();
  document.getElementById("evidence").replaceChildren();
  const message = el("p", "note", `Map cannot be rendered: ${error.message}`);
  message.setAttribute("role", "alert");
  document.querySelector(".board").replaceChildren(message);
}
</script>
</body>
</html>
