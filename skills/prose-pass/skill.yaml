schema_version: 1
name: prose-pass
display_name: Prose Pass
summary: Aleysian voice for writing intended for people.
status: active
tier: core
version: 1.4.0
owner: Aleysian
category: evidence-quality
runtimes:
- generic-agent-skills
- chatgpt
- codex
- claude-ai
- cowork
triggers:
- 'Apply Aleysian voice when drafting, rewriting, or gating writing intended for people,
  including messages, reviews, tickets, UI copy, emails, proposals, decks, reports, and
  narrative artifacts.'
exclusions:
- AI instructions, agent guidance, indexes, registers, ledgers, schemas, and generated audit records.
- Raw evidence, logs, code syntax, machine-readable data, quotations, and required verbatim language.
- Selection based only on a file extension, including Markdown.
inputs:
- name: task_context
  required: true
  description: The request and available source context for this workflow.
outputs:
- name: markdown_run_record
  format: markdown
  audience: internal-or-client-as-requested
  durable: true
  hub_target: null
connectors:
  required: []
  optional: []
depends_on: []
calls: []
knowledge_hub:
  requirement: not-applicable
  reads: []
  writes: []
evidence:
  required: false
  control: null
quality:
  required: false
  control: null
