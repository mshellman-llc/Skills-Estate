schema_version: 1
name: ddoc
display_name: DDoc
summary: Authors, gates, and builds the DDOC, the client-facing Deal Decision
  deck presented immediately before the proposal.
status: active
tier: core
version: 1.0.0
owner: estate-maintainer
category: pursuit-intelligence
runtimes:
- generic-agent-skills
- chatgpt
- codex
- claude-ai
- cowork
triggers:
- 'Authors, gates, and builds the DDOC, the client-facing Deal Decision deck
  presented immediately before the proposal. Interactive copy approval first, then
  the PPTX build. Two modes: decision mode when the client is choosing between options,
  confirmation mode when there is one option. `build_ddoc.js --check` gates a manifest
  without rendering, so copy can be gated even where the renderer cannot be installed.
  Use when asked to build, review, de-slop, gate, or rebuild a DDOC, a deal decision
  deck, an options deck, a scope deck, or the deck presented before the proposal.
  Trigger on "DDOC", "deal decision deck", "options deck", "options slide", "version
  slide", "scope deck", "discussion document" (a retired name for this same artifact),
  "the deck before the proposal", "the deck that goes with the SOW", or a Q-number
  paired with a deck request. Do NOT trigger for SOW review (that is sow-quality),
  prose editing (that is prose-pass), or PPTX mechanics (that is pptx).'
exclusions: []
inputs:
- name: task_context
  required: true
  description: The request and available source context for this workflow.
outputs:
- name: deal_decision_deck
  format: pptx
  audience: internal-or-client-as-requested
  durable: true
  hub_target: deliverables.register
connectors:
  required: []
  optional:
  - google-drive
depends_on:
- knowledge-hub
calls:
- evidence-core
- quality-gate
knowledge_hub:
  requirement: required
  reads:
  - opportunity.front_door
  - opportunity.discovery
  - opportunity.solution_scope
  - opportunity.commercial
  - evidence.claims
  writes:
  - opportunity.pursuit_history
  - deliverables.register
evidence:
  required: true
  control: evidence-core
quality:
  required: true
  control: quality-gate
