schema_version: 1
name: delivery-suite
display_name: Delivery Suite
summary: 'Orchestrates the delivery half of the Aleysian sell-to-deliver lifecycle,
  from signed SOW through hypercare closeout: the stage map (Handoff, 01 Mobilize,
  02 Analyze, 03 Design, 04 Build, 05 Validate, 06 Deploy and closeout), the named
  human gates, which skill owns each stage''s artifacts, and the per-engagement DELIVERY-STATE.md
  convention.'
status: active
tier: situational
version: 0.2.1
owner: Aleysian
category: delivery-lifecycle
runtimes:
- generic-agent-skills
- chatgpt
- codex
- claude-ai
- cowork
triggers:
- 'Orchestrates the delivery half of the Aleysian sell-to-deliver lifecycle, from
  signed SOW through hypercare closeout: the stage map (Handoff, 01 Mobilize, 02 Analyze,
  03 Design, 04 Build, 05 Validate, 06 Deploy and closeout), the named human gates,
  which skill owns each stage''s artifacts, and the per-engagement DELIVERY-STATE.md
  convention. Owns the map, not the artifacts: it routes to the owning skill. Use
  whenever a request concerns a live delivery engagement and the owning skill is not
  obvious: "where are we on the Acme project", "what''s next after the charter", "the
  SOW just signed, now what", "get us to go-live", "kick off delivery", "what gate
  are we at", "close out the engagement", or any post-signature request naming a stage,
  gate, or delivery artifact without naming its skill. Do NOT trigger when the user
  named the artifact or its skill directly (weekly status is delivery-status);
  call the owner. Do not use pre-signature; route directly to the named sales artifact owner.'
exclusions: []
inputs:
- name: task_context
  required: true
  description: The request and available source context for this workflow.
outputs:
- name: markdown_run_record
  format: markdown
  audience: internal-or-client-as-requested
  durable: true
  hub_target: deliverables.register
connectors:
  required: []
  optional:
  - google-drive
depends_on:
- knowledge-hub
calls:
- cutover-closeout
- delivery-status
- evidence-core
- quality-gate
- s2d-handoff
knowledge_hub:
  requirement: required
  reads:
  - engagement.front_door
  - engagement.contract_commitments
  - engagement.delivery_status
  - engagement.control
  writes:
  - engagement.delivery_status
  - engagement.control
evidence:
  required: true
  control: evidence-core
quality:
  required: true
  control: quality-gate
