schema_version: 1
name: session-handoff
display_name: Session Handoff
summary: Produce a structured end-of-session handoff so a fresh agent can pick up
  the work without re-explanation.
status: active
tier: situational
version: 1.0.0
owner: Aleysian
category: evidence-quality
runtimes:
- generic-agent-skills
- chatgpt
- codex
- claude-ai
- cowork
triggers:
- Produce a structured end-of-session handoff so a fresh agent can pick up the work
  without re-explanation. Use whenever the user says "session handoff", "wrap up session",
  "hand off", "handoff summary", "summarize before I clear", or signals they are about
  to /clear or open a new chat. Also use proactively under context pressure, such
  as an auto-compact warning, "running low on context", "this chat is getting long",
  "should I start a new chat", or a long session about to be interrupted. Covers provenance,
  decisions, shipped changes, rejected approaches, user corrections, key files, running
  state, verification, deferrals, and open questions. Do not use for status reports
  written for humans, retrospectives, PR descriptions or commit messages, memory consolidation,
  or a recap of the last few turns.
exclusions: []
inputs:
- name: task_context
  required: true
  description: The request and available source context for this workflow.
outputs:
- name: markdown_run_record
  format: markdown
  audience: internal-or-client-as-requested
  durable: true
  hub_target: null
connectors:
  required: []
  optional: []
depends_on: []
calls: []
knowledge_hub:
  requirement: not-applicable
  reads: []
  writes: []
evidence:
  required: false
  control: null
quality:
  required: false
  control: null
