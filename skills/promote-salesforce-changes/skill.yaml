schema_version: 1
name: promote-salesforce-changes
display_name: DevOps Center Promotion
summary: Validate capabilities, reconcile stale work-item branches, and promote work
  items or stages through Salesforce DevOps Center.
status: active
tier: situational
version: 1.2.0
owner: Estate maintainer
category: delivery-lifecycle
runtimes:
- generic-agent-skills
- chatgpt
- codex
- claude-ai
- cowork
triggers:
- Promote Salesforce DevOps Center work items or stages, validate a promotion,
  prepare a one-off stage promotion, recover a stale WI branch or promotion conflict,
  combine dependent work items, or complete a promotion.
exclusions:
- Work-item creation and ordinary status updates belong to manage-salesforce-devops.
inputs:
- name: task_context
  required: true
  description: Work-item IDs, target stage, control org, and available Git or PR evidence.
outputs:
- name: promotion_result
  format: code-and-terminal-output
  audience: internal
  durable: true
  hub_target: null
connectors:
  required: []
  optional: []
depends_on:
- manage-salesforce-devops
calls: []
knowledge_hub:
  requirement: not-applicable
  reads: []
  writes: []
evidence:
  required: false
  control: null
quality:
  required: false
  control: null
