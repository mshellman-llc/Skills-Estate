schema_version: 1
name: scope-reference
display_name: Scope Reference
summary: Build a static, print-ready, Aleysian-branded scope reference from live scoping-app
  quotes.
status: active
tier: situational
version: 1.0.0
owner: Aleysian
category: solutioning-scope
runtimes:
- generic-agent-skills
- chatgpt
- codex
- claude-ai
- cowork
triggers:
- Build a static, print-ready, Aleysian-branded scope reference from live scoping-app
  quotes. For several options, show option cards plus one complete side-by-side line-item
  matrix with hours and in, available, optional, or out states. For one quote, show
  one summary plus an in and optional matrix. Validate every item, hour, state, and
  timeline-snapshot price 1:1 before rendering. Use for a scope reference, option
  summary, scope comparison, option matrix, what is included, what is in each tier,
  a flat client leave-behind, or a side-by-side comparison of Q-numbers. This page
  shows the full matrix at once. Never use it for a clickable or interactive proposal,
  a version switcher, or a page where the prospect switches between versions one at
  a time; use interactive-proposal. Not a DDOC decision deck or SOW contract.
exclusions: []
inputs:
- name: task_context
  required: true
  description: The request and available source context for this workflow.
outputs:
- name: markdown_run_record
  format: markdown
  audience: internal-or-client-as-requested
  durable: true
  hub_target: deliverables.register
connectors:
  required: []
  optional:
  - google-drive
depends_on:
- knowledge-hub
calls:
- evidence-core
- quality-gate
knowledge_hub:
  requirement: required
  reads:
  - opportunity.front_door
  - opportunity.solution_scope
  - evidence.claims
  writes:
  - opportunity.solution_scope
  - deliverables.register
evidence:
  required: true
  control: evidence-core
quality:
  required: true
  control: quality-gate
