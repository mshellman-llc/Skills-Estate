schema_version: 1
name: decision-register
display_name: Decision Register
summary: 'Keeps refinement and discovery questions as a decision register with owners, editable status and saved answers, and exports them back to the tracker.'
status: draft
tier: core
version: 0.1.0
owner: estate-maintainer
category: delivery-planning
runtimes:
- claude-code
- codex
- cowork
triggers:
- 'Record open questions from refinement or meeting notes.'
- 'Find questions without an owner or still blocked.'
- 'Export recorded answers for the tracker.'
exclusions:
- 'Discovery synthesis (discovery).'
- 'The RAID decision log on a signed engagement (delivery-status).'
- 'Requirements capture (requirements-backlog).'
inputs:
- name: questions
  required: true
  description: 'content/questions.json.'
- name: saved_answers
  required: false
  description: 'The answers collection read from the published page.'
outputs:
- name: decisions.csv
  format: csv
  audience: internal-or-client-as-requested
  durable: true
- name: decisions.md
  format: markdown
  audience: internal-or-client-as-requested
  durable: true
connectors:
  required: []
  optional:
  - jira
depends_on:
- review-site-kit
calls: []
risk_controls:
- 'Never changes tracker tickets; exports are prepared for the client to import.'
- 'Client data, names and brand values stay in the engagement folder, never in the skill.'
costs:
  measured: false
