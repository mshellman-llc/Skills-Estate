name: Verify skills estate
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: python3 tools/estate.py validate
      - run: python3 -m unittest discover -s tests -v
      - run: python3 tools/estate.py build
      - run: python3 tools/estate.py bundle
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: skills-estate-bundles
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: skills-estate-map
          path: |
            artifacts/skills-map/index.html
            artifacts/skills-map/index.json
            artifacts/skills-map/assets/fonts/OFL.txt
          if-no-files-found: error
