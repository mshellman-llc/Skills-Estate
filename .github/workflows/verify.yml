name: Verify skills estate
# Branch pushes are verified through their pull request, so push runs only on main.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 -m pip install -r requirements-test.txt
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      # GitHub's Ubuntu runner already ships Google Chrome and the system libraries it
      # needs, so only Playwright's own Chromium build is fetched, and it is cached by
      # Playwright version. --with-deps reinstalled those libraries through apt and
      # cost about six minutes a run.
      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('./node_modules/playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium
      - name: Configure test runtimes
        run: |
          echo "ESTATE_NODE=$(command -v node)" >> "$GITHUB_ENV"
          echo "ESTATE_NODE_MODULES=$GITHUB_WORKSPACE/node_modules" >> "$GITHUB_ENV"
          echo "NODE_PATH=$GITHUB_WORKSPACE/node_modules" >> "$GITHUB_ENV"
          echo "PW_MODULE=file://$GITHUB_WORKSPACE/node_modules/playwright/index.mjs" >> "$GITHUB_ENV"
      - name: Rebuild map from this GitHub revision
        shell: bash
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            map_baseline="$GITHUB_SHA"
          else
            map_baseline="$(git rev-parse refs/remotes/origin/main)"
          fi
          python3 artifacts/skills-map/build.py --base "$map_baseline"
          python3 tools/browse.py --check
      - run: python3 tools/estate.py validate
      - name: Verify the recorded plugin version against this checkout
        run: python3 tools/plugin_version.py
      - run: python3 tools/run_tests.py --all-integrations --report .local/test-results.json
      - name: Verify and capture the synthetic field guide
        run: |
          mkdir -p .local/render-verification/field-guide
          python3 skills/assess-solution-delivery/scripts/build_field_guide.py skills/assess-solution-delivery/assets/field-guide.body.html --output .local/render-verification/field-guide.html
          node skills/assess-solution-delivery/scripts/qa_field_guide.mjs "file://$GITHUB_WORKSPACE/.local/render-verification/field-guide.html" .local/render-verification/field-guide > .local/render-verification/field-guide-result.json
      # Artifacts count against the account's Actions storage. Debug evidence uploads only
      # when a step fails; downloadable packages upload only from main, where the map
      # viewer and the browse pages look for them. Each upload sets its own retention.
      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: skills-estate-render-evidence
          path: |
            .local/test-results.json
            .local/render-verification/
          if-no-files-found: warn
          retention-days: 7
      - run: python3 tools/estate.py build
      - run: python3 tools/estate.py bundle
      - run: python3 tools/browse.py --bundle
      - uses: actions/upload-artifact@v7.0.2
        if: github.ref == 'refs/heads/main'
        with:
          name: skill-collections
          path: dist/groups/*.zip
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v7.0.2
        if: github.ref == 'refs/heads/main'
        with:
          name: skills-estate-map
          path: |
            artifacts/skills-map/index.html
            artifacts/skills-map/index.json
            artifacts/skills-map/viewer.py
            artifacts/skills-map/open-map.command
            artifacts/skills-map/assets/fonts/OFL.txt
          if-no-files-found: error
          retention-days: 30
