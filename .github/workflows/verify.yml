name: Verify skills estate
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 -m pip install -r requirements-test.txt
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Configure test runtimes
        run: |
          echo "ESTATE_NODE=$(command -v node)" >> "$GITHUB_ENV"
          echo "ESTATE_NODE_MODULES=$GITHUB_WORKSPACE/node_modules" >> "$GITHUB_ENV"
          echo "NODE_PATH=$GITHUB_WORKSPACE/node_modules" >> "$GITHUB_ENV"
          echo "PW_MODULE=file://$GITHUB_WORKSPACE/node_modules/playwright/index.mjs" >> "$GITHUB_ENV"
      - run: python3 tools/estate.py validate
      - run: python3 -m unittest discover -s tests -v
      - run: python3 tools/estate.py build
      - run: python3 tools/estate.py bundle
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: skills-estate-bundles
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: skills-estate-map
          path: |
            artifacts/skills-map/index.html
            artifacts/skills-map/index.json
          if-no-files-found: error
