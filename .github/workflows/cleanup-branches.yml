name: Delete merged branches
on:
  pull_request:
    types: [closed]
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: read
jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Delete the branch of a merged pull request
        if: github.event_name == 'pull_request' && github.event.pull_request.merged && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${BRANCH}" || echo "Already deleted: ${BRANCH}"
      - name: Delete every remaining merged branch, and the retired marketplace branch
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          merged=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls?state=closed&per_page=100" \
            --jq ".[] | select(.merged_at != null and .head.repo.full_name == \"${GITHUB_REPOSITORY}\") | .head.ref")
          for branch in $merged marketplace; do
            [ "$branch" = main ] && continue
            if gh api "repos/${GITHUB_REPOSITORY}/branches/${branch}" >/dev/null 2>&1; then
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}" && echo "Deleted ${branch}"
            fi
          done
