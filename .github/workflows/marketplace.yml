name: Publish plugin marketplace
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: marketplace
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - name: Build the plugins from main
        run: |
          mkdir -p .local
          python3 tools/plugins.py --root-marketplace
          python3 tools/plugins.py --owner
      - name: Commit the plugin folders to main
        shell: bash
        run: |
          rm -rf plugins
          cp -R dist/plugins/claude/plugins plugins
          git add -A plugins .claude-plugin/marketplace.json
          if git diff --cached --quiet; then echo "Plugins unchanged"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Publish plugins from ${GITHUB_SHA::7} [skip ci]"
          for attempt in 1 2 3; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
      - name: Attach plugin ZIPs to the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete plugins-latest --yes --cleanup-tag || true
          gh release create plugins-latest dist/plugins/claude/*.zip --target main \
            --title "Plugins (latest)" \
            --notes "Built from main at ${GITHUB_SHA::7}. To install by hand in Cowork or claude.ai: Customize, Plugins, Add, Upload plugin, then choose each ZIP."
