schema_version: 1
name: assess-solution-delivery
display_name: Solution Brief
summary: Produces and validates Estate Solution Briefs from an evidence-governed
  relational solution graph.
status: active
tier: core
version: 1.0.0
owner: Estate
category: solutioning-scope
runtimes:
- generic-agent-skills
- chatgpt
- codex
- claude-ai
- cowork
triggers:
- 'Produces and validates Estate Solution Briefs from an evidence-governed relational
  solution graph. Use when judging technical deliverability or preparing an approval-mode
  or build-reference Solution Brief. It models systems, interfaces, failure paths,
  ADRs, scope, risks, assumptions, dependencies, roles, allocations, phases, milestones,
  financial traceability, reconciliation controls, typed relationships, and audience
  views. It stops at a Technical Readiness Memo when load-bearing evidence is insufficient
  and rejects generic claim-card artifacts that flatten the solution relationships.
  Field guide mode builds the internal pursuit-team guide off the same graph: section
  set confirmed before building, sections earned by evidence rather than required
  by node presence, a build ledger of native, configured, custom, and dependency rows,
  and a named-skeptic Q&A that ends each answer in a dependency ask. Use it for "field
  guide", "the in-house build we are up against", or a guide for holding a scoping
  call.'
exclusions: []
inputs:
- name: task_context
  required: true
  description: The request and available source context for this workflow.
outputs:
- name: markdown_run_record
  format: markdown
  audience: internal-or-client-as-requested
  durable: true
  hub_target: deliverables.register
connectors:
  required: []
  optional:
  - google-drive
depends_on:
- knowledge-hub
calls:
- evidence-core
- review-deliverable
knowledge_hub:
  requirement: required
  reads:
  - opportunity.front_door
  - opportunity.discovery
  - opportunity.solution_scope
  - evidence.claims
  writes:
  - opportunity.solution_scope
  - deliverables.register
evidence:
  required: true
  control: evidence-core
quality:
  required: true
  control: review-deliverable
