schema_version: 1
name: design-software-system
display_name: System Design
summary: Produce a fast, unbranded working design for a new system, service, API,
  or data architecture, usually inline.
status: active
tier: situational
version: 1.0.0
owner: Estate
category: solutioning-scope
runtimes:
- generic-agent-skills
- chatgpt
- codex
- claude-ai
- cowork
triggers:
- Produce a fast, unbranded working design for a new system, service, API, or data
  architecture, usually inline. Cover requirements, components, data flow, data model,
  API contracts, storage, caching, queues, scaling, reliability, capacity, and explicit
  trade-offs. Use when someone asks how to build or structure a new product or service,
  how it will scale, what throughput, latency, availability or capacity it needs,
  which database, cache, queue, REST, GraphQL, or gRPC approach fits, or wants component
  boundaries explored before decisions are formalized. Also trigger when a user describes
  a system they intend to build and asks how to approach it. Not for reviewing existing
  code, and not for capturing a single already-made decision as a short record with
  its consequences. For a formal sourced architecture or engineering reference,
  select the embedded formal architecture reference mode and its write-architecture-reference workflow.
exclusions: []
inputs:
- name: task_context
  required: true
  description: The request and available source context for this workflow.
outputs:
- name: markdown_run_record
  format: markdown
  audience: internal-or-client-as-requested
  durable: true
  hub_target: null
connectors:
  required: []
  optional: []
depends_on: []
calls: []
knowledge_hub:
